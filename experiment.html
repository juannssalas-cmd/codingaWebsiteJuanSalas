<p id="pizza-message">Hover over a slice!</p>

<script>
  const pizzaPieces = document.querySelectorAll(".pizza-piece");
  const pizzaMessage = document.getElementById("pizza-message");

  pizzaPieces.forEach((piece, index) => {
    piece.addEventListener("mouseenter", () => {
      pizzaMessage.textContent =
        "Slice " + (index + 1) + " looks delicious!";
    });

    piece.addEventListener("click", () => {
      pizzaPieces.forEach(slice => {
        slice.classList.remove("selected");
        slice.setAttribute("aria-pressed", "false");
      });

      piece.classList.add("selected");
      piece.setAttribute("aria-pressed", "true");

      pizzaMessage.textContent =
        "You picked slice " + (index + 1) + "!";
    });

    piece.setAttribute("aria-pressed", "false");
  });
</script>
